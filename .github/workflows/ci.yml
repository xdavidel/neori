name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly

env:
  DEPS_APT: curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev

jobs:
  test:
    strategy:
      fail-fast: false

    name: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --no-run --all --exclude neori-visual-tests

      - name: Test
        run: cargo test --all --exclude neori-visual-tests -- --nocapture

  build:
    strategy:
      fail-fast: false

    name: check feature combinations
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check (no default features)
        run: cargo check --no-default-features

      - name: Check (just dbus)
        run: cargo check --no-default-features --features dbus

      - name: Check (just systemd)
        run: cargo check --no-default-features --features systemd

      - name: Check (just dinit)
        run: cargo check --no-default-features --features dinit

      - name: Check (just xdp-gnome-screencast)
        run: cargo check --no-default-features --features xdp-gnome-screencast

      - name: Check
        run: cargo check

      - name: Build (with profiling)
        run: cargo build --features profile-with-tracy

  randomized-tests:
    strategy:
      fail-fast: false

    name: randomized and slow tests
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: 1
      RUN_SLOW_TESTS: 1
      PROPTEST_CASES: 200000
      PROPTEST_MAX_LOCAL_REJECTS: 200000
      PROPTEST_MAX_GLOBAL_REJECTS: 200000
      PROPTEST_MAX_SHRINK_ITERS: 200000

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --no-run --all --exclude neori-visual-tests --release

      - name: Test
        run: cargo test --all --exclude neori-visual-tests --release

  visual-tests:
    strategy:
      fail-fast: false

    name: visual tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --package neori-visual-tests

  msrv:
    strategy:
      fail-fast: false

    name: msrv
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets

  clippy:
    strategy:
      fail-fast: false

    name: clippy
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all --all-targets

  rustfmt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  nix:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          dotnet: false
          large-packages: false
        
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        continue-on-error: true

      - run: nix flake check
        continue-on-error: true

  build-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xdavidel/neori'
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          show-progress: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
            enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: docs/

      - name: Generate neori documentation
        run: uv run mkdocs build
        working-directory: docs/

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate rustdoc documentation
        run: cargo doc --no-deps -p neori-ipc

      - run: |
          mkdir -p publish/neori_ipc
          cp -r ./target/doc/* ./publish/
          cp -r ./docs/site/* ./publish/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish

  publish-docs:
    runs-on: ubuntu-24.04
    needs:
      - build-docs
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
